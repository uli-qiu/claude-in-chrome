# 自动打包 Chrome 扩展：
# - push 到 main：跑测试 + 打 zip 上传为构建产物（Artifacts）
# - 推送 v* 标签：测试 + 打 zip + 创建 GitHub Release 供用户下载
name: build-extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        # 输出同时留给下一步：失败时提炼成注解，运行页上直接可见
        run: node --test test/*.test.js 2>&1 | tee test-output.log

      - name: Summarize test failures (as annotations)
        if: failure()
        # node:test 末尾的 "✖ failing tests:" 段：用例名 + 断言信息，每行一条 error 注解
        run: |
          sed -n '/✖ failing tests:/,$p' test-output.log | grep -vE '^\s*$' | head -40 \
            | sed 's/::/%3A%3A/g' \
            | while IFS= read -r line; do echo "::error title=Test failure::$line"; done

      - name: Regenerate icons (reproducible build check)
        run: node tools/gen-icon.mjs && git diff --exit-code -- extension/icons/

      - name: Package extension
        run: |
          cd extension
          zip -r "../claude-in-chrome-extension.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-in-chrome-extension
          path: claude-in-chrome-extension.zip

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-in-chrome-extension.zip
          generate_release_notes: true
